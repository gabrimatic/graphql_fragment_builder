name: Dart CI

on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "test/**"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/dart.yml"
  pull_request:
    branches: [master]
    paths:
      - "lib/**"
      - "test/**"
      - "example/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/dart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.5.1", stable]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

      - name: Package dry run
        run: dart pub publish --dry-run
