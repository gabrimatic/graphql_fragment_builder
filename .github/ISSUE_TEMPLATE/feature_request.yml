name: Feature request
description: Suggest a small package capability or API improvement.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What GraphQL shape or workflow should the package support?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Preferred API
      description: Show the Dart code you would like to write.
      render: dart
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Expected GraphQL output
      render: graphql
    validations:
      required: false
